    skills: `# Agent Skills 关系图

  };

  /* ======================================================================
     2. 调色板 —— 修正原版引号混用导致的数组解析失败
     ====================================================================== */
  const PALETTE = {
    dark: ['#5e81ac', '#88c0d0', '#a3be8c', '#ebcb8b', '#d08770', '#b48ead', '#81a1c1'],
    light: ['#4c7899', '#3a8ea0', '#6a9455', '#b8860b', '#c25e3a', '#8e5e87', '#6c9abb']
  };

  /* ======================================================================
     3. 状态
     ====================================================================== */
  let currentMap = 'architecture';
  let currentTheme = 'dark';
  let expandLevel = 3;
  let mm = null;
  let lastRoot = null;

  /* markmap-lib / markmap-view 的 UMD 全局都挂在 window.markmap 命名空间下。
     原版代码引用的 markmapLib 从未定义，会导致渲染直接抛错。 */
  const Transformer = window.markmap && window.markmap.Transformer;
  const Markmap = window.markmap && window.markmap.Markmap;

  if (!Transformer || !Markmap) {
    document.getElementById('stats').textContent =
      '⚠️ Markmap 资源加载失败，请检查网络后刷新';
    return;
  }

  const transformer = new Transformer();

  /* ======================================================================
     4. 渲染
     ====================================================================== */
  /* 给每个一级分支分配稳定序号，使其所有后代共用同一色系，
     避免 Markmap 默认"按深度取色"导致同一层节点全部同色 */
  function assignBranches(root) {
    root.payload = root.payload || {};
    root.payload.branch = -1;
    (root.children || []).forEach(function (child, i) {
      (function walk(n) {
        n.payload = n.payload || {};
        n.payload.branch = i;
        (n.children || []).forEach(walk);
      })(child);
    });
  }

  function colorFor(theme) {
    var colors = PALETTE[theme];
    return function (node) {
      var b = node.payload && typeof node.payload.branch === 'number'
        ? node.payload.branch : null;
      if (b === null || b < 0) return colors[0];
      return colors[(b + 1) % colors.length];
    };
  }

  function countNodes(node) {
    let nodes = 1;
    let depth = node.state ? node.state.depth || 0 : 0;
    (node.children || []).forEach(child => {
      const r = countNodes(child);
      nodes += r.nodes;
      depth = Math.max(depth, r.depth);
    });
    return { nodes, depth };
  }

  function render(fit) {
    const { root } = transformer.transform(maps[currentMap]);
    lastRoot = root;
    assignBranches(root);

    const options = {
      duration: 400,
      maxWidth: 300,
      spacingHorizontal: 90,
      spacingVertical: 12,
      paddingX: 14,
      autoFit: false,
      initialExpandLevel: expandLevel,
      colorFreezeLevel: 0,
      color: colorFor(currentTheme)
    };

    if (!mm) {
      mm = Markmap.create('#mindmap', options, root);
    } else {
      mm.setOptions(options);
      mm.setData(root);
    }

    const stat = countNodes(root);
    document.getElementById('stat-nodes').textContent = stat.nodes;
    document.getElementById('stat-depth').textContent = stat.depth;

    if (fit !== false) {
      setTimeout(() => mm.fit(), 60);
    }
  }

  /* ======================================================================
     5. 交互
     ====================================================================== */
  function switchMap(key) {
    currentMap = key;
    ['architecture', 'workflow', 'skills'].forEach(k => {
      document.getElementById('btn-' + k).classList.toggle('active', k === key);
    });
    render();
  }

  ['architecture', 'workflow', 'skills'].forEach(key => {
    document.getElementById('btn-' + key)
      .addEventListener('click', () => switchMap(key));
  });

  document.getElementById('btn-expand').addEventListener('click', () => {
    expandLevel = -1;
    render();
  });

  document.getElementById('btn-collapse').addEventListener('click', () => {
    expandLevel = 2;
    render();
  });

  document.getElementById('btn-fit').addEventListener('click', () => {
    if (mm) mm.fit();
  });

  document.getElementById('btn-theme').addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.body.className = 'theme-' + currentTheme;
    document.getElementById('btn-theme').textContent =
      currentTheme === 'dark' ? '☀︎ 浅色' : '☾ 深色';
    render(false);
  });

  /* 窗口尺寸变化时重新适应 */
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (mm) mm.fit(); }, 160);
  });

  /* ======================================================================
     6. 启动
     ====================================================================== */
  window.addEventListener('load', () => render());
})();
</script>
